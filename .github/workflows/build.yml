name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Native hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev-tunnel
          $ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk | tail -n 1)/ndk-build \
            -C /tmp/hev-tunnel \
            NDK_PROJECT_PATH=/tmp/hev-tunnel \
            APP_BUILD_SCRIPT=/tmp/hev-tunnel/Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a"
          mkdir -p app/src/main/jniLibs
          cp -r /tmp/hev-tunnel/libs/* app/src/main/jniLibs/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burst-rhythm-testbed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
